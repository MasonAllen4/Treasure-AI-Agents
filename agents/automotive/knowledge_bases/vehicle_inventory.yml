name: Vehicle Inventory
database: automotive_db
tables:
  - name: inventory
    td_query: |
      SELECT
        vehicle_id,
        make,
        model,
        year,
        trim,
        exterior_color,
        interior_color,
        mileage,
        price,
        condition,
        fuel_type,
        key_features,
        days_on_lot
      FROM vehicle_inventory
      WHERE is_available = true
    enable_data: true
    enable_data_index: true
