name: Subscriber Profiles
database: media_streaming_db
tables:
  - name: subscriber_profiles
    td_query: |
      SELECT
        subscriber_id,
        first_name,
        subscription_tier,
        subscription_expiry_date,
        last_content_play_date,
        genre_preferences,
        last_content_played,
        total_plays_lifetime,
        region
      FROM subscriber_profiles
    enable_data: true
    enable_data_index: true
